<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMI 体重指数计算器</title>
  <style>
    :root {
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e3e6ec;
      --track: rgba(15, 23, 42, 0.14);
      --focus: #3b82f6;
      --under: #3b82f6;
      --normal: #22c55e;
      --over: #f59e0b;
      --obese: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1b1e27;
        --text: #e8eaf0;
        --muted: #9aa1ad;
        --border: #2c3140;
        --track: rgba(232, 234, 240, 0.18);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 28px 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 18px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    .field input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .result { margin-top: 26px; text-align: center; }
    .bmi-value { font-size: 56px; font-weight: 700; line-height: 1.1; }
    .category {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--muted);
    }
    .category.under { background: var(--under); }
    .category.normal { background: var(--normal); }
    .category.over { background: var(--over); }
    .category.obese { background: var(--obese); }
    .scale {
      position: relative;
      height: 14px;
      margin: 28px 8px 20px;
    }
    .scale .seg {
      position: absolute;
      top: 0;
      height: 100%;
      opacity: 0.85;
    }
    .scale .seg:first-child { border-radius: 999px 0 0 999px; }
    .scale .seg:last-of-type { border-radius: 0 999px 999px 0; }
    .marker {
      position: absolute;
      top: -6px;
      width: 6px;
      height: 26px;
      background: var(--text);
      border-radius: 3px;
      transform: translateX(-50%);
      transition: left 0.2s ease;
    }
    .scale-labels {
      position: relative;
      height: 16px;
      margin: 0 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .scale-labels span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .scale-labels span.first { transform: none; }
    .scale-labels span.last { transform: translateX(-100%); }
    .healthy-range {
      margin: 14px 0 0;
      font-size: 14px;
      color: var(--muted);
    }
    .hint {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      text-align: left;
    }
    @media (max-width: 480px) {
      .card { padding: 22px 18px 18px; }
      .inputs { grid-template-columns: 1fr; }
      .bmi-value { font-size: 44px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>BMI 体重指数计算器</h1>
    <p class="subtitle">BMI = 体重 (kg) ÷ 身高 (m)²，输入即实时计算，无需联网</p>

    <div class="inputs">
      <div class="field">
        <label for="height">身高（cm）</label>
        <input id="height" type="number" inputmode="decimal" min="100" max="250" step="1" value="170" />
      </div>
      <div class="field">
        <label for="weight">体重（kg）</label>
        <input id="weight" type="number" inputmode="decimal" min="20" max="300" step="0.1" value="65" />
      </div>
    </div>

    <section class="result" aria-live="polite">
      <div class="bmi-value" id="bmi-value">—</div>
      <div class="category" id="category">等待输入</div>

      <div class="scale" aria-hidden="true">
        <div class="seg" style="left:0; width:17.86%; background:var(--under)"></div>
        <div class="seg" style="left:17.86%; width:39.29%; background:var(--normal)"></div>
        <div class="seg" style="left:57.14%; width:28.57%; background:var(--over)"></div>
        <div class="seg" style="left:85.71%; width:14.29%; background:var(--obese)"></div>
        <div class="marker" id="marker" style="left:50%"></div>
      </div>
      <div class="scale-labels" aria-hidden="true">
        <span class="first" style="left:0">16</span>
        <span style="left:17.86%">18.5</span>
        <span style="left:57.14%">24</span>
        <span style="left:85.71%">28</span>
        <span class="last" style="left:100%">30</span>
      </div>

      <p class="healthy-range" id="healthy-range">请输入身高与体重</p>
    </section>

    <p class="hint">
      分类采用中国标准（WS/T 428-2013）：BMI &lt; 18.5 偏瘦；18.5 – 23.9 正常；24 – 27.9 超重；≥ 28 肥胖。
      BMI 仅为粗略筛查指标，运动员、孕产妇、老年人等特殊人群请结合专业评估。
      可通过链接参数预设数值，例如 <code>bmi-calculator.html?h=175&amp;w=70</code>。
    </p>
  </main>

  <script>
    (function () {
      'use strict';

      var H_MIN = 100, H_MAX = 250, W_MIN = 20, W_MAX = 300;
      var S_MIN = 16, S_MAX = 30;

      var heightInput = document.getElementById('height');
      var weightInput = document.getElementById('weight');
      var bmiValue = document.getElementById('bmi-value');
      var category = document.getElementById('category');
      var marker = document.getElementById('marker');
      var rangeText = document.getElementById('healthy-range');

      function num(v) {
        var n = parseFloat(v);
        return isFinite(n) ? n : null;
      }

      function categoryOf(bmi) {
        if (bmi < 18.5) return ['under', '偏瘦'];
        if (bmi < 24) return ['normal', '正常'];
        if (bmi < 28) return ['over', '超重'];
        return ['obese', '肥胖'];
      }

      function render() {
        var h = num(heightInput.value);
        var w = num(weightInput.value);
        var valid = h !== null && w !== null &&
          h >= H_MIN && h <= H_MAX && w >= W_MIN && w <= W_MAX;

        if (!valid) {
          bmiValue.textContent = '—';
          category.textContent = '等待输入';
          category.className = 'category';
          marker.style.visibility = 'hidden';
          rangeText.textContent = '请输入身高（100–250 cm）与体重（20–300 kg）';
          return;
        }

        var bmi = w / Math.pow(h / 100, 2);
        var pos = Math.min(1, Math.max(0, (bmi - S_MIN) / (S_MAX - S_MIN)));
        var cls = categoryOf(bmi);

        bmiValue.textContent = bmi.toFixed(1);
        category.textContent = cls[1];
        category.className = 'category ' + cls[0];
        marker.style.visibility = 'visible';
        marker.style.left = (pos * 100).toFixed(2) + '%';

        var lo = (18.5 * Math.pow(h / 100, 2)).toFixed(1);
        var hi = (23.9 * Math.pow(h / 100, 2)).toFixed(1);
        rangeText.textContent = '该身高下的健康体重范围：' + lo + ' – ' + hi + ' kg';
      }

      var params = new URLSearchParams(window.location.search);
      var h = params.get('h');
      var w = params.get('w');
      if (h !== null && num(h) !== null) heightInput.value = h;
      if (w !== null && num(w) !== null) weightInput.value = w;

      heightInput.addEventListener('input', render);
      weightInput.addEventListener('input', render);
      render();
    })();
  </script>
</body>
</html>
