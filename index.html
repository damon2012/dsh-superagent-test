<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#110c0b" id="themeColor">
<meta name="description" content="一个零依赖、打开即用的纯 HTML 番茄钟：专注计时、短休息、长休息、提示音与今日统计。">
<title>番茄钟 · 专注计时器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='37' r='21' fill='%23ff6b4a'/%3E%3Cpath d='M32 16c2-5 7-7 12-5-1 3-4 5-7 6 4 0 7 2 9 5-4 2-9 2-13 0 0 0-1 1-1 1s-1-1-1-1c-4 2-9 2-13 0 2-3 5-5 9-5-3-1-6-3-7-6 5-2 10 0 12 5z' fill='%234caf6d'/%3E%3C/svg%3E">
<script>
  (function () {
    var theme = 'dark';
    try {
      var saved = JSON.parse(localStorage.getItem('pomodoro.theme.v1'));
      if (saved === 'light' || saved === 'dark') {
        theme = saved;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        theme = 'light';
      }
    } catch (e) {
      theme = 'dark';
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    --bg: #100b0a;
    --glow-1: rgba(255, 96, 57, .17);
    --glow-2: rgba(80, 160, 255, .07);
    --panel: rgba(255, 255, 255, .045);
    --panel-border: rgba(255, 255, 255, .09);
    --panel-top: rgba(255, 255, 255, .065);
    --panel-bottom: rgba(255, 255, 255, .025);
    --text: #f8f0ec;
    --muted: #bda9a2;
    --faint: #8d7a73;
    --track: rgba(255, 255, 255, .10);
    --surface: rgba(255, 255, 255, .055);
    --surface-hover: rgba(255, 255, 255, .10);
    --tab-active: rgba(255, 255, 255, .10);
    --dialog-bg: #1c1412;
    --shadow: 0 40px 90px -30px rgba(0, 0, 0, .9), 0 2px 0 rgba(255, 255, 255, .04) inset;
    --accent: #ff6b4a;
    --accent-weak: rgba(255, 107, 74, .22);
    --cta-from: #f0502b;
    --cta-to: #ff8748;
    --cta-shadow: rgba(240, 80, 43, .38);
    color-scheme: dark;
  }

  [data-theme="light"] {
    --bg: #f7f1ea;
    --glow-1: rgba(255, 132, 92, .26);
    --glow-2: rgba(120, 170, 255, .16);
    --panel: rgba(255, 255, 255, .62);
    --panel-border: rgba(93, 58, 44, .12);
    --panel-top: rgba(255, 255, 255, .80);
    --panel-bottom: rgba(255, 255, 255, .48);
    --text: #35241e;
    --muted: #8a7267;
    --faint: #a5908a;
    --track: rgba(74, 42, 30, .12);
    --surface: rgba(74, 42, 30, .05);
    --surface-hover: rgba(74, 42, 30, .09);
    --tab-active: #ffffff;
    --dialog-bg: #fffaf6;
    --shadow: 0 40px 90px -40px rgba(93, 58, 44, .35), 0 1px 0 rgba(255, 255, 255, .8) inset;
    --accent: #e05231;
    --accent-weak: rgba(224, 82, 49, .18);
    color-scheme: light;
  }

  body[data-mode="focus"] { --accent: #ff6b4a; --accent-weak: rgba(255, 107, 74, .22); }
  body[data-mode="short"] { --accent: #3fd0b3; --accent-weak: rgba(63, 208, 179, .20); }
  body[data-mode="long"] { --accent: #7aa6ff; --accent-weak: rgba(122, 166, 255, .20); }
  [data-theme="light"] body[data-mode="focus"] { --accent: #df4f2e; --accent-weak: rgba(223, 79, 46, .16); }
  [data-theme="light"] body[data-mode="short"] { --accent: #0f9f85; --accent-weak: rgba(15, 159, 133, .14); }
  [data-theme="light"] body[data-mode="long"] { --accent: #3f74d6; --accent-weak: rgba(63, 116, 214, .14); }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 4vw, 48px) clamp(16px, 4vw, 32px);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: background-color .45s ease, color .45s ease;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .ambient::before,
  .ambient::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    transition: background .5s ease;
  }
  .ambient::before {
    width: 62vmax;
    height: 62vmax;
    left: -22vmax;
    top: -28vmax;
    background: var(--glow-1);
  }
  .ambient::after {
    width: 52vmax;
    height: 52vmax;
    right: -20vmax;
    bottom: -24vmax;
    background: var(--glow-2);
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 552px;
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: rise .65s cubic-bezier(.2, .8, .2, 1) both;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    user-select: none;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    font-size: 21px;
    line-height: 1;
    border-radius: 13px;
    background: linear-gradient(155deg, rgba(255, 107, 74, .22), rgba(255, 107, 74, .06));
    border: 1px solid rgba(255, 107, 74, .28);
    box-shadow: 0 8px 22px -12px rgba(255, 107, 74, .65), 0 1px 0 rgba(255, 255, 255, .08) inset;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .brand-text small {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .28em;
    color: var(--faint);
    text-transform: uppercase;
  }

  .topbar-actions { display: flex; align-items: center; gap: 2px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .12s ease;
  }
  .icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--panel-border); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { display: block; }

  .icon-sun, .icon-moon, .sound-on, .sound-off { display: inline-flex; }
  .icon-moon, .sound-off { display: none; }
  [data-theme="light"] .icon-sun { display: none; }
  [data-theme="light"] .icon-moon { display: inline-flex; }
  body[data-sound="off"] .sound-on { display: none; }
  body[data-sound="off"] .sound-off { display: inline-flex; }

  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 30px 22px;
    border-radius: 30px;
    border: 1px solid var(--panel-border);
    background: linear-gradient(165deg, var(--panel-top), var(--panel-bottom));
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(22px);
    backdrop-filter: blur(22px);
    transition: background .45s ease, border-color .45s ease, box-shadow .45s ease;
  }

  .modes {
    display: flex;
    width: 100%;
    gap: 4px;
    padding: 4px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--panel-border);
    transition: background .4s ease;
  }

  .mode-tab {
    flex: 1;
    min-width: 0;
    padding: 9px 6px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab[aria-selected="true"] {
    background: var(--tab-active);
    color: var(--accent);
    box-shadow: 0 8px 20px -12px rgba(0, 0, 0, .55);
  }

  .timer {
    position: relative;
    width: min(300px, 74vw);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    margin: 2px 0 0;
  }

  .timer-halo {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-weak) 0%, transparent 66%);
    filter: blur(16px);
    opacity: .95;
    transition: background .45s ease;
  }

  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .ring-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 2;
  }
  .ring-ticks {
    fill: none;
    stroke: var(--track);
    stroke-width: 1.5;
    stroke-dasharray: 1 11;
    opacity: .55;
    transform-box: fill-box;
    transform-origin: center;
  }
  body.is-running .ring-ticks { animation: spin 90s linear infinite; }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 879.646;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 7px var(--accent-weak));
    transition: stroke .45s ease;
  }

  .timer-face {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    text-align: center;
  }

  .phase {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--muted);
    transition: color .3s ease;
  }
  .phase::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transition: background .4s ease, box-shadow .4s ease;
  }

  .clock {
    font-size: clamp(58px, 15vw, 78px);
    line-height: 1;
    font-weight: 300;
    letter-spacing: .015em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    color: var(--accent);
    text-shadow: 0 0 34px var(--accent-weak);
    transition: color .45s ease, text-shadow .45s ease;
  }

  .round {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 1px;
  }
  .dots { display: flex; align-items: center; gap: 5px; }
  .dot {
    width: 16px;
    height: 5px;
    border-radius: 99px;
    background: var(--track);
    transition: background .35s ease, box-shadow .35s ease, transform .35s ease;
  }
  .dot.is-done {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-weak);
    transform: translateY(-.5px);
  }
  .round-count {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 50px;
    border-radius: 15px;
    border: 1px solid transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .03em;
    min-width: 0;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-ghost {
    width: 86px;
    background: transparent;
    border-color: var(--panel-border);
    color: var(--muted);
  }
  .btn-ghost:hover { color: var(--text); background: var(--surface); }
  .btn-primary {
    width: 152px;
    border: 0;
    color: #fff;
    background: linear-gradient(135deg, var(--cta-from), var(--cta-to));
    box-shadow: 0 16px 32px -14px var(--cta-shadow);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 20px 38px -14px var(--cta-shadow); }
  .btn-primary:active { transform: scale(.97); }

  .btn-icon { display: inline-flex; width: 16px; height: 16px; }
  .btn-icon svg { width: 16px; height: 16px; }
  .icon-pause { display: none; }
  body.is-running .icon-play { display: none; }
  body.is-running .icon-pause { display: inline-flex; }

  .stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    width: 100%;
    padding-top: 17px;
    border-top: 1px solid var(--panel-border);
    transition: border-color .4s ease;
  }
  .stat { display: flex; align-items: baseline; gap: 7px; }
  .stat-value {
    font-size: 19px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: color .4s ease;
  }
  .stat-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .stat-divider { width: 1px; height: 22px; background: var(--panel-border); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--faint);
  }
  .hint kbd {
    display: inline-block;
    margin: 0 1px;
    padding: 0 5px;
    border: 1px solid var(--panel-border);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 10.5px;
    line-height: 1.55;
  }
  .hint .sep { margin: 0 7px; opacity: .5; }

  dialog {
    width: min(92vw, 424px);
    padding: 0;
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    background: var(--dialog-bg);
    color: var(--text);
    box-shadow: 0 50px 120px -30px rgba(0, 0, 0, .75);
  }
  dialog::backdrop {
    background: rgba(9, 5, 4, .58);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
  .dialog-card { padding: 22px 24px 20px; }
  .dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .dialog-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .dialog-sub {
    margin: 0 0 18px;
    font-size: 12px;
    line-height: 1.65;
    color: var(--muted);
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .field span { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
  .field input {
    width: 100%;
    height: 42px;
    padding: 0 11px;
    border: 1px solid var(--panel-border);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    transition: border-color .2s ease, background .2s ease;
  }
  .field input:focus { outline: none; border-color: var(--accent); background: transparent; }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .field-note {
    margin: 0 0 14px;
    font-size: 11px;
    color: var(--faint);
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--panel-border);
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
  }
  .switch-row small {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    font-weight: 400;
    color: var(--faint);
    line-height: 1.4;
  }
  .switch-row input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    flex: none;
    width: 42px;
    height: 24px;
    margin: 0;
    border: 1px solid var(--panel-border);
    border-radius: 99px;
    background: var(--track);
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .switch-row input[type="checkbox"]::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
    transition: transform .2s ease;
  }
  .switch-row input[type="checkbox"]:checked {
    background: var(--cta-from);
    border-color: var(--cta-from);
  }
  .switch-row input[type="checkbox"]:checked::after { transform: translateX(18px); }

  .dialog-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .dialog-actions .btn { flex: 1; width: auto; height: 46px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 560px) {
    .app { gap: 14px; }
    .panel { padding: 20px 16px 18px; border-radius: 26px; gap: 17px; }
    .brand-mark { width: 37px; height: 37px; font-size: 19px; }
    .topbar-actions { gap: 0; }
    .icon-btn { width: 36px; height: 36px; }
    .timer { width: min(276px, 76vw); }
    .btn-ghost { width: 72px; }
    .btn-primary { width: 136px; }
    .stats { gap: 20px; }
    .hint { font-size: 10.5px; line-height: 1.8; }
    .hint .sep { margin: 0 5px; }
    .clock { font-size: clamp(54px, 17vw, 68px); }
    .dialog-card { padding: 20px 18px 18px; }
  }

  @media (max-width: 380px) {
    .brand-text small { display: none; }
    .mode-tab { font-size: 12.5px; }
    .field-grid { gap: 7px; }
    .field span { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body data-mode="focus" data-sound="on">
  <div class="ambient" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍅</span>
        <span class="brand-text">番茄钟<small>Pomodoro</small></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭提示音" aria-pressed="true" title="提示音">
          <span class="sound-on" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </span>
          <span class="sound-off" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
          </span>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换到浅色模式" title="切换主题">
          <span class="icon-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
          <span class="icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </span>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="打开设置" title="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
        </button>
      </div>
    </header>

    <section class="panel">
      <div class="modes" role="tablist" aria-label="计时模式">
        <button class="mode-tab" id="tab-focus" type="button" role="tab" data-mode="focus" aria-selected="true" aria-controls="timerPanel" tabindex="0">专注</button>
        <button class="mode-tab" id="tab-short" type="button" role="tab" data-mode="short" aria-selected="false" aria-controls="timerPanel" tabindex="-1">短休息</button>
        <button class="mode-tab" id="tab-long" type="button" role="tab" data-mode="long" aria-selected="false" aria-controls="timerPanel" tabindex="-1">长休息</button>
      </div>

      <div class="timer" id="timerPanel" role="tabpanel" aria-labelledby="tab-focus">
        <div class="timer-halo" aria-hidden="true"></div>
        <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
          <circle class="ring-ticks" cx="160" cy="160" r="151"></circle>
          <circle class="ring-track" cx="160" cy="160" r="140"></circle>
          <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="140"></circle>
        </svg>
        <div class="timer-face">
          <span class="phase" id="phaseLabel">专注时间</span>
          <div class="clock" id="timeDisplay" role="timer" aria-live="off" aria-label="剩余时间">25:00</div>
          <div class="round" id="roundInfo" aria-label="本轮已完成 0 个番茄，共 4 个">
            <span class="dots" id="roundDots" aria-hidden="true">
              <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
            </span>
            <span class="round-count" id="roundCount" aria-hidden="true">0 / 4</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-ghost" id="resetBtn" type="button" title="重置（R）">重置</button>
        <button class="btn btn-primary" id="startBtn" type="button" aria-label="开始计时">
          <span class="btn-icon icon-play" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12 8 5.14Z"/></svg>
          </span>
          <span class="btn-icon icon-pause" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.6" y="5" width="4" height="14" rx="1.2"/><rect x="13.4" y="5" width="4" height="14" rx="1.2"/></svg>
          </span>
          <span id="startLabel">开始</span>
        </button>
        <button class="btn btn-ghost" id="skipBtn" type="button" title="跳过（S）">跳过</button>
      </div>

      <div class="stats" aria-label="今日专注统计">
        <div class="stat"><span class="stat-value" id="todayCount">0</span><span class="stat-label">今日番茄</span></div>
        <span class="stat-divider" aria-hidden="true"></span>
        <div class="stat"><span class="stat-value" id="todayMinutes">0</span><span class="stat-label">专注分钟</span></div>
      </div>
    </section>

    <p class="hint">
      <kbd>空格</kbd> 开始 / 暂停 <span class="sep">·</span>
      <kbd>R</kbd> 重置 <span class="sep">·</span>
      <kbd>S</kbd> 跳过 <span class="sep">·</span>
      <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换模式
    </p>
  </main>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form class="dialog-card" id="settingsForm" novalidate>
      <div class="dialog-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" type="button" id="closeSettingsBtn" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="dialog-sub">调整三个阶段的时间。每完成 4 个番茄，自动进入一次长休息。</p>

      <div class="field-grid">
        <label class="field"><span>专注（分钟）</span><input id="focusInput" type="number" min="1" max="90" step="1" inputmode="numeric" value="25"></label>
        <label class="field"><span>短休息（分钟）</span><input id="shortInput" type="number" min="1" max="30" step="1" inputmode="numeric" value="5"></label>
        <label class="field"><span>长休息（分钟）</span><input id="longInput" type="number" min="1" max="60" step="1" inputmode="numeric" value="15"></label>
      </div>
      <p class="field-note">范围：专注 1–90、短休息 1–30、长休息 1–60 分钟。</p>

      <label class="switch-row">
        <span>自动开始下一阶段<small>专注结束后直接开始休息，休息结束后直接开始专注。</small></span>
        <input id="autoStartInput" type="checkbox">
      </label>
      <label class="switch-row">
        <span>完成时播放提示音<small>使用浏览器内置音频合成，无需任何外部文件。</small></span>
        <input id="soundInput" type="checkbox">
      </label>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="defaultsBtn">恢复默认</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  <noscript><p style="text-align:center">请启用 JavaScript 以使用番茄钟。</p></noscript>

<script>
(function () {
  'use strict';

  var STORAGE = {
    settings: 'pomodoro.settings.v1',
    stats: 'pomodoro.stats.v1',
    theme: 'pomodoro.theme.v1'
  };

  var DEFAULTS = {
    focusMinutes: 25,
    shortMinutes: 5,
    longMinutes: 15,
    autoStart: false,
    sound: true
  };

  var MODE_SETTING = {
    focus: 'focusMinutes',
    short: 'shortMinutes',
    long: 'longMinutes'
  };

  var MODE_META = {
    focus: { phase: '专注时间', tab: '专注' },
    short: { phase: '短休息', tab: '短休息' },
    long: { phase: '长休息', tab: '长休息' }
  };

  var RING_CIRCUMFERENCE = 2 * Math.PI * 140;

  function clampInt(value, min, max, fallback) {
    var number = Number(value);
    if (!isFinite(number)) return fallback;
    return Math.min(max, Math.max(min, Math.round(number)));
  }

  function readStore(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (error) {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      /* Private mode or disabled storage: the timer still works for this session. */
    }
  }

  function loadSettings() {
    var stored = readStore(STORAGE.settings, null);
    var source = stored && typeof stored === 'object' ? stored : {};
    return {
      focusMinutes: clampInt(source.focusMinutes, 1, 90, DEFAULTS.focusMinutes),
      shortMinutes: clampInt(source.shortMinutes, 1, 30, DEFAULTS.shortMinutes),
      longMinutes: clampInt(source.longMinutes, 1, 60, DEFAULTS.longMinutes),
      autoStart: source.autoStart === true,
      sound: source.sound !== false
    };
  }

  function saveSettings() {
    writeStore(STORAGE.settings, {
      focusMinutes: settings.focusMinutes,
      shortMinutes: settings.shortMinutes,
      longMinutes: settings.longMinutes,
      autoStart: settings.autoStart,
      sound: settings.sound
    });
  }

  function todayKey() {
    var date = new Date();
    return date.getFullYear() +
      '-' + String(date.getMonth() + 1).padStart(2, '0') +
      '-' + String(date.getDate()).padStart(2, '0');
  }

  function loadStats() {
    var stored = readStore(STORAGE.stats, null);
    if (stored && stored.date === todayKey()) {
      return {
        date: stored.date,
        pomodoros: Math.max(0, Math.floor(Number(stored.pomodoros) || 0)),
        minutes: Math.max(0, Math.floor(Number(stored.minutes) || 0))
      };
    }
    return { date: todayKey(), pomodoros: 0, minutes: 0 };
  }

  function saveStats() {
    writeStore(STORAGE.stats, stats);
  }

  function refreshStats() {
    if (stats.date !== todayKey()) {
      stats = { date: todayKey(), pomodoros: 0, minutes: 0 };
    }
    return stats;
  }

  function minutesToMs(minutes) {
    return Math.round(minutes * 60 * 1000);
  }

  function phaseDuration(mode) {
    return minutesToMs(settings[MODE_SETTING[mode]]);
  }

  function formatClock(ms) {
    var totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  var settings = loadSettings();
  var stats = loadStats();

  var state = {
    mode: 'focus',
    totalMs: phaseDuration('focus'),
    remainingMs: phaseDuration('focus'),
    endAt: 0,
    running: false,
    cycle: 0
  };

  var ticker = null;

  var elements = {
    body: document.body,
    clock: document.getElementById('timeDisplay'),
    phase: document.getElementById('phaseLabel'),
    roundInfo: document.getElementById('roundInfo'),
    roundDots: document.getElementById('roundDots'),
    roundCount: document.getElementById('roundCount'),
    dots: Array.prototype.slice.call(document.querySelectorAll('#roundDots .dot')),
    tabs: Array.prototype.slice.call(document.querySelectorAll('.mode-tab')),
    tablist: document.querySelector('.modes'),
    timerPanel: document.getElementById('timerPanel'),
    ring: document.getElementById('ringProgress'),
    startBtn: document.getElementById('startBtn'),
    startLabel: document.getElementById('startLabel'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
    themeBtn: document.getElementById('themeBtn'),
    soundBtn: document.getElementById('soundBtn'),
    settingsBtn: document.getElementById('settingsBtn'),
    todayCount: document.getElementById('todayCount'),
    todayMinutes: document.getElementById('todayMinutes'),
    dialog: document.getElementById('settingsDialog'),
    form: document.getElementById('settingsForm'),
    focusInput: document.getElementById('focusInput'),
    shortInput: document.getElementById('shortInput'),
    longInput: document.getElementById('longInput'),
    autoStartInput: document.getElementById('autoStartInput'),
    soundInput: document.getElementById('soundInput'),
    defaultsBtn: document.getElementById('defaultsBtn'),
    closeSettingsBtn: document.getElementById('closeSettingsBtn'),
    live: document.getElementById('liveRegion'),
    themeColor: document.getElementById('themeColor')
  };

  var announceTimer = null;
  var audioContext = null;

  function announce(message) {
    if (!elements.live) return;
    window.clearTimeout(announceTimer);
    elements.live.textContent = '';
    announceTimer = window.setTimeout(function () {
      elements.live.textContent = message;
    }, 40);
  }

  function ensureAudio() {
    try {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioContext) audioContext = new AudioCtor();
      if (audioContext.state === 'suspended' && audioContext.resume) {
        audioContext.resume();
      }
    } catch (error) {
      audioContext = null;
    }
  }

  function playChime() {
    if (!settings.sound) return;
    try {
      ensureAudio();
      if (!audioContext) return;
      var now = audioContext.currentTime;
      [523.25, 659.25, 783.99].forEach(function (frequency, index) {
        var oscillator = audioContext.createOscillator();
        var gain = audioContext.createGain();
        var start = now + index * 0.14;
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.16, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.62);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + 0.66);
      });
    } catch (error) {
      /* Audio is a nice-to-have; the timer keeps working without it. */
    }
  }

  function stopTicker() {
    if (ticker !== null) {
      window.clearInterval(ticker);
      ticker = null;
    }
  }

  function renderThemeButton() {
    var isLight = document.documentElement.dataset.theme === 'light';
    elements.themeBtn.setAttribute('aria-label', isLight ? '切换到深色模式' : '切换到浅色模式');
    elements.themeBtn.setAttribute('title', isLight ? '切换到深色模式' : '切换到浅色模式');
  }

  function setTheme(theme) {
    var next = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    writeStore(STORAGE.theme, next);
    renderThemeButton();
    if (elements.themeColor) {
      elements.themeColor.setAttribute('content', next === 'light' ? '#f7f1ea' : '#110c0b');
    }
  }

  function renderSoundButton() {
    elements.soundBtn.setAttribute('aria-pressed', String(settings.sound));
    elements.soundBtn.setAttribute('aria-label', settings.sound ? '关闭提示音' : '开启提示音');
    elements.soundBtn.setAttribute('title', settings.sound ? '关闭提示音' : '开启提示音');
    document.body.dataset.sound = settings.sound ? 'on' : 'off';
  }

  function renderTabs() {
    elements.tabs.forEach(function (tab) {
      var selected = tab.dataset.mode === state.mode;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
    });
    var activeTab = document.getElementById('tab-' + state.mode);
    if (activeTab) elements.timerPanel.setAttribute('aria-labelledby', activeTab.id);
  }

  function renderRound() {
    elements.dots.forEach(function (dot, index) {
      dot.classList.toggle('is-done', index < state.cycle);
    });
    var done = Math.min(4, state.cycle);
    elements.roundCount.textContent = done + ' / 4';
    elements.roundInfo.setAttribute('aria-label', '本轮已完成 ' + done + ' 个番茄，共 4 个');
  }

  function renderStats() {
    elements.todayCount.textContent = String(stats.pomodoros);
    elements.todayMinutes.textContent = String(stats.minutes);
  }

  function renderControls() {
    var label = '开始';
    if (state.running) {
      label = '暂停';
    } else if (state.remainingMs < state.totalMs && state.remainingMs > 0) {
      label = '继续';
    }
    elements.startLabel.textContent = label;
    elements.startBtn.setAttribute('aria-label', label + '计时');
    elements.startBtn.setAttribute('title', label + '（空格）');
    document.body.classList.toggle('is-running', state.running);
  }

  function renderTitle() {
    var base = '番茄钟 · 专注计时器';
    if (state.running || (state.remainingMs < state.totalMs && state.remainingMs > 0)) {
      document.title = formatClock(state.remainingMs) + ' · ' + MODE_META[state.mode].tab + ' — 番茄钟';
    } else {
      document.title = base;
    }
  }

  function render() {
    var remaining = Math.max(0, state.remainingMs);
    var ratio = state.totalMs > 0 ? Math.min(1, Math.max(0, remaining / state.totalMs)) : 0;

    elements.clock.textContent = formatClock(remaining);
    elements.clock.setAttribute('aria-label', '剩余时间 ' + formatClock(remaining));
    elements.phase.textContent = MODE_META[state.mode].phase;
    elements.ring.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - ratio));
    elements.body.dataset.mode = state.mode;

    renderTabs();
    renderRound();
    renderStats();
    renderControls();
    renderTitle();
  }

  function startTimer() {
    if (state.running) return;
    if (state.remainingMs <= 0) state.remainingMs = state.totalMs;

    stopTicker();
    ensureAudio();
    state.endAt = Date.now() + state.remainingMs;
    state.running = true;
    ticker = window.setInterval(tick, 200);
    tick();
  }

  function pauseTimer() {
    if (!state.running) return;
    state.remainingMs = Math.max(0, state.endAt - Date.now());
    state.running = false;
    stopTicker();
    render();
  }

  function resetTimer() {
    stopTicker();
    state.running = false;
    state.totalMs = phaseDuration(state.mode);
    state.remainingMs = state.totalMs;
    render();
  }

  function toggleTimer() {
    if (state.running) pauseTimer();
    else startTimer();
  }

  function selectMode(mode, options) {
    if (!MODE_META[mode]) return;
    stopTicker();
    state.running = false;
    state.mode = mode;
    state.totalMs = phaseDuration(mode);
    state.remainingMs = state.totalMs;
    render();
    if (options && options.autoStart) startTimer();
  }

  function skipPhase() {
    var wasLongBreak = state.mode === 'long';
    stopTicker();
    state.running = false;
    var next = state.mode === 'focus' ? 'short' : 'focus';
    if (wasLongBreak) state.cycle = 0;
    selectMode(next, { autoStart: settings.autoStart });
    announce('已跳过' + MODE_META[state.mode].tab + (settings.autoStart ? '，已自动开始' : ''));
  }

  function completePhase() {
    if (!state.running) return;
    stopTicker();
    state.running = false;

    var finished = state.mode;
    var next;
    var message;

    if (finished === 'focus') {
      state.cycle = Math.min(4, state.cycle + 1);
      stats = refreshStats();
      stats.pomodoros += 1;
      stats.minutes += settings.focusMinutes;
      saveStats();
      next = state.cycle >= 4 ? 'long' : 'short';
      message = state.cycle >= 4 ? '第 4 个番茄完成，进入长休息' : '专注完成，休息一下';
    } else {
      if (finished === 'long') state.cycle = 0;
      next = 'focus';
      message = finished === 'long' ? '长休息结束，开始新的循环' : '休息结束，开始下一轮专注';
    }

    playChime();
    selectMode(next, { autoStart: settings.autoStart });
    announce(message + (settings.autoStart ? '，已自动开始' : '，按开始继续'));
  }

  function tick() {
    if (!state.running) return;
    var remaining = state.endAt - Date.now();
    if (remaining <= 0) {
      state.remainingMs = 0;
      completePhase();
    } else {
      state.remainingMs = remaining;
      render();
    }
  }

  function openSettings() {
    elements.focusInput.value = String(settings.focusMinutes);
    elements.shortInput.value = String(settings.shortMinutes);
    elements.longInput.value = String(settings.longMinutes);
    elements.autoStartInput.checked = settings.autoStart;
    elements.soundInput.checked = settings.sound;
    if (typeof elements.dialog.showModal === 'function' && !elements.dialog.open) {
      elements.dialog.showModal();
    } else if (!elements.dialog.open) {
      elements.dialog.setAttribute('open', '');
    }
    window.setTimeout(function () {
      try {
        elements.focusInput.focus();
      } catch (error) {
        /* Focus is a progressive enhancement. */
      }
    }, 30);
  }

  function closeSettings() {
    if (typeof elements.dialog.close === 'function') {
      elements.dialog.close();
    } else {
      elements.dialog.removeAttribute('open');
    }
  }

  function applyCurrentDurations() {
    if (!state.running && state.remainingMs === state.totalMs) {
      state.totalMs = phaseDuration(state.mode);
      state.remainingMs = state.totalMs;
    }
    render();
  }

  elements.startBtn.addEventListener('click', toggleTimer);
  elements.resetBtn.addEventListener('click', resetTimer);
  elements.skipBtn.addEventListener('click', skipPhase);

  elements.tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      selectMode(tab.dataset.mode);
    });
  });

  elements.tablist.addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    var currentIndex = elements.tabs.indexOf(document.activeElement);
    if (currentIndex === -1) currentIndex = elements.tabs.indexOf(elements.tabs.filter(function (tab) {
      return tab.dataset.mode === state.mode;
    })[0]);
    var direction = event.key === 'ArrowRight' ? 1 : -1;
    var nextIndex = (currentIndex + direction + elements.tabs.length) % elements.tabs.length;
    elements.tabs[nextIndex].focus();
    selectMode(elements.tabs[nextIndex].dataset.mode);
  });

  elements.themeBtn.addEventListener('click', function () {
    setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });

  elements.soundBtn.addEventListener('click', function () {
    settings.sound = !settings.sound;
    saveSettings();
    renderSoundButton();
    if (settings.sound) {
      ensureAudio();
      playChime();
    }
  });

  elements.settingsBtn.addEventListener('click', openSettings);
  elements.closeSettingsBtn.addEventListener('click', closeSettings);

  elements.dialog.addEventListener('click', function (event) {
    if (event.target === elements.dialog) closeSettings();
  });

  elements.form.addEventListener('submit', function (event) {
    event.preventDefault();
    settings.focusMinutes = clampInt(elements.focusInput.value, 1, 90, settings.focusMinutes);
    settings.shortMinutes = clampInt(elements.shortInput.value, 1, 30, settings.shortMinutes);
    settings.longMinutes = clampInt(elements.longInput.value, 1, 60, settings.longMinutes);
    settings.autoStart = elements.autoStartInput.checked;
    settings.sound = elements.soundInput.checked;
    saveSettings();
    renderSoundButton();
    applyCurrentDurations();
    closeSettings();
    announce('设置已保存');
  });

  elements.defaultsBtn.addEventListener('click', function () {
    elements.focusInput.value = String(DEFAULTS.focusMinutes);
    elements.shortInput.value = String(DEFAULTS.shortMinutes);
    elements.longInput.value = String(DEFAULTS.longMinutes);
    elements.autoStartInput.checked = DEFAULTS.autoStart;
    elements.soundInput.checked = DEFAULTS.sound;
  });

  document.addEventListener('keydown', function (event) {
    if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
    var target = event.target;
    var tagName = target && target.tagName ? target.tagName : '';
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tagName) || (target && target.isContentEditable)) return;
    if (elements.dialog.open) return;

    if (event.code === 'Space') {
      if (target && target.closest && target.closest('button')) return;
      event.preventDefault();
      toggleTimer();
    } else if (event.key === 'r' || event.key === 'R') {
      event.preventDefault();
      resetTimer();
    } else if (event.key === 's' || event.key === 'S') {
      event.preventDefault();
      skipPhase();
    } else if (event.key === '1') {
      event.preventDefault();
      selectMode('focus');
    } else if (event.key === '2') {
      event.preventDefault();
      selectMode('short');
    } else if (event.key === '3') {
      event.preventDefault();
      selectMode('long');
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.running) tick();
  });

  elements.ring.style.strokeDasharray = String(RING_CIRCUMFERENCE);
  renderThemeButton();
  renderSoundButton();
  render();
})();
</script>
</body>
</html>
